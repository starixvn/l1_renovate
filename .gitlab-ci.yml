renovate:
  variables:
    RENOVATE_TOKEN: $GITLAB_TOKEN
    GITHUB_COM_TOKEN: $GITHUB_TOKEN
    DOCKER_USERNAME: $CI_REGISTRY_USER # needed to allow Renovate to check against GitLabs own Docker container registry
    DOCKER_PASSWORD: $CI_REGISTRY_PASSWORD
  image:
    name: registry.nexdev.net:5050/docker/tools/renovate:31.97.2-slim
    entrypoint: [""]
  script:
    - ln -sF $CI_PROJECT_DIR/config.js /usr/src/app/
    - renovate
